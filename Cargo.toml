[workspace]
resolver = "2"
members = [
    "crates/rimeterm",
    "crates/rimeterm-core",
    "crates/rimeterm-config",
    "crates/rimeterm-pty",
    "crates/rimeterm-ipc",
    "crates/rimectl",
    "crates/rimeterm-tui",
    "crates/rimeterm-markdown",
    "crates/fast-resume",
    "crates/rimeterm-models",
    "crates/rimeterm-stock",
    "crates/rimeterm-zones",
    "crates/tuxedo",
    "crates/glab-tui",
]

[workspace.package]
version = "0.2.36"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
authors = ["cjzzz <zisheng.cao@protonmail.com>"]
repository = "https://github.com/caozisheng/rimeterm"
description = "TUI-native terminal built for coding agents."

[workspace.dependencies]
# workspace-internal
rimeterm-core   = { path = "crates/rimeterm-core",   version = "0.2" }
rimeterm-config = { path = "crates/rimeterm-config", version = "0.2" }
rimeterm-pty    = { path = "crates/rimeterm-pty",    version = "0.2" }
rimeterm-tui    = { path = "crates/rimeterm-tui",    version = "0.2" }
rimeterm-markdown = { path = "crates/rimeterm-markdown", version = "0.2" }
rimeterm-models = { path = "crates/rimeterm-models", version = "0.2" }
rimeterm-stock  = { path = "crates/rimeterm-stock",  version = "0.2" }
rimeterm-zones  = { path = "crates/rimeterm-zones",  version = "0.2" }
glab-tui        = { path = "crates/glab-tui" }
tuxedo          = { path = "crates/tuxedo" }
fast-resume      = { path = "crates/fast-resume" }

rimeterm-ipc    = { path = "crates/rimeterm-ipc",    version = "0.2" }
# third-party
tokio         = { version = "1", features = ["rt-multi-thread", "sync", "macros", "io-util", "time"] }
tokio-stream  = { version = "0.1", features = ["sync"] }
crossterm     = { version = "0.29", features = ["event-stream", "bracketed-paste"] }
ratatui       = { version = "0.30", default-features = false, features = ["crossterm", "std"] }
serde         = { version = "1", features = ["derive"] }
toml          = "0.9"
chrono        = { version = "0.4", features = ["serde"] }
chrono-tz     = "0.10"
akshare       = { git = "https://github.com/Cricle/akshare-rs", rev = "e7291600ab99ee95e6b38b0ce1301154d6eb46d8", default-features = false, features = ["mod-stock", "mod-index", "mod-news"] }
alacritty_terminal = "0.26" # C17: default vt backend (migrated from vt100)
portable-pty  = "0.9"
anyhow        = "1"
thiserror     = "2"
bytes         = "1"
tracing       = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
which         = "8"
directories   = "6"
unicode-width = "0.2"
# C22.6 mouse selection: cross-platform system clipboard access. Default
# features cover Windows/macOS/X11; we skip the optional Wayland (wl-clipboard)
# extra because the X11 fallback is fine on wl-roots compositors via XWayland.
arboard       = { version = "3", default-features = false }
# C20 viewer overlay (§19.11)
tui-markdown  = { version = "0.3.8", default-features = false }
ratatui-image = { version = "11", default-features = false, features = ["crossterm", "image-defaults"] }
tui-file-explorer = { git = "https://github.com/caozisheng/tui-file-explorer.git", rev = "fc463b5", default-features = false }
gix           = { version = "=0.86.0", default-features = false, features = ["status", "revision", "blob-diff", "sha1"] }
gix-diff      = { version = "=0.66.0", default-features = false, features = ["blob", "index", "sha1"] }
tree-sitter   = "=0.25.10"
tree-sitter-highlight = "=0.25.10"
tree-sitter-rust = "=0.24.2"
tree-sitter-c = "=0.24.2"
tree-sitter-cpp = "=0.23.4"
tree-sitter-python = "=0.25.0"
tree-sitter-javascript = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-json = "=0.24.8"
tree-sitter-toml-ng = "=0.7.0"
tree-sitter-yaml = "=0.7.2"
tree-sitter-bash = "=0.25.1"
image         = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# C22 viewer code-highlighting. `default-fancy` swaps `onig` (C dep,
# awkward on Windows MSVC) for `fancy-regex` (pure Rust). Trade-off:
# fancy-regex is ~1.4× slower on pathological grammars — irrelevant for
# a viewport-bounded read-only viewer.
#
# NB: we deliberately do NOT depend on `syntect-tui` — that crate targets
# ratatui 0.29 and would drop a duplicate ratatui into the tree just to
# translate `syntect::Style` → `ratatui::Style`. The translation is ~40
# lines and lives inline in `viewer::code_highlight`.
syntect       = { version = "5.2", default-features = false, features = ["default-fancy"] }
# C25 Native SysmonPane. `sysinfo` sampled on a std::thread worker
# (same pattern as git_worker); `humansize` formats byte/rate values.
# `sysinfo 0.38.x` pins the last line supporting our workspace rustc
# 1.90 (0.39+ bumped MSRV to 1.95).
sysinfo   = { version = "0.38", default-features = false, features = ["system", "network", "disk", "component"] }
humansize = "2.1"
# Optional feature deps — declared here without `optional = true`
# (workspace inheritance doesn't allow it); each consuming crate opts
# in with `optional = true` at its own `[dependencies]` entry. Real
# runtime requirements (Linux cgroup FS / NVIDIA driver / Docker
# socket) mean the default build keeps them out entirely.
procfs        = { version = "0.18", default-features = false }
nvml-wrapper  = { version = "0.12" }
bollard       = { version = "0.21", default-features = false, features = ["ssl_providerless"] }

[workspace.lints.rust]
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
needless_pass_by_value = "warn"
redundant_clone = "warn"

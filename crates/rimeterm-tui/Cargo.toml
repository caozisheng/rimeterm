[package]
name = "rimeterm-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "ratatui front-end: renderer, keymap, layout, app-menu."

[lints]
workspace = true

[dependencies]
rimeterm-core = { workspace = true }
rimeterm-config = { workspace = true }
rimeterm-pty = { workspace = true }
rimeterm-ipc = { workspace = true }
serde_json = "1"
parking_lot = "0.12"
serde = { workspace = true }
alacritty_terminal = { workspace = true }
crossterm = { workspace = true }
ratatui = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tracing = { workspace = true }
regex = "1.10"
futures = { version = "0.3", default-features = false, features = ["std"] }
which = { workspace = true }
unicode-width = { workspace = true }
arboard = { workspace = true }
anyhow = { workspace = true }
# C20 viewer overlay
tui-markdown = { workspace = true }
rimeterm-markdown = { workspace = true }
ratatui-image = { workspace = true }
image = { workspace = true }
tui-file-explorer = { workspace = true }
gix = { workspace = true }
gix-diff = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-highlight = { workspace = true }
tree-sitter-rust = { workspace = true }
tree-sitter-c = { workspace = true }
tree-sitter-cpp = { workspace = true }
tree-sitter-python = { workspace = true }
tree-sitter-javascript = { workspace = true }
tree-sitter-typescript = { workspace = true }
tree-sitter-json = { workspace = true }
tree-sitter-toml-ng = { workspace = true }
tree-sitter-yaml = { workspace = true }
tree-sitter-bash = { workspace = true }
# C22 viewer code-highlighting (translation to ratatui styles lives in
# `viewer::code_highlight`; no upstream adapter crate needed).
syntect = { workspace = true }

[dev-dependencies]
tempfile = "3"

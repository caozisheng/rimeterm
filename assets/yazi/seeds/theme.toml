# Yazi colour theme.
#
# Seeded by rimeterm on first launch. Safe to edit; rimeterm never
# overwrites this file. Delete `~/.rimeterm/yazi/theme.toml` to
# re-seed it on next start.
#
# Two paths to change Yazi's colours:
#
# ============================================================
# A) Install a ready-made flavour (recommended, one line).
# ============================================================
#
# Yazi flavours live in `yazi-rs/flavors` on GitHub. Install one
# with `ya` (bundled at `~/.rimeterm/bin/ya`):
#
#   ya pkg add yazi-rs/flavors:catppuccin-mocha
#   ya pkg add yazi-rs/flavors:catppuccin-latte
#
# Then uncomment the block below. `dark` / `light` names must match a
# `<name>.yazi/` folder under `~/.rimeterm/yazi/flavors/`. Yazi picks
# `dark` when the terminal palette is dark, `light` otherwise.
#
# [flavor]
# dark  = "catppuccin-mocha"
# light = "catppuccin-latte"
#
# Full flavour list: https://github.com/yazi-rs/flavors
#
# ============================================================
# B) Hand-tune the built-in colours (below).
# ============================================================
#
# Complete schema + every recognised key:
# https://yazi-rs.github.io/docs/configuration/theme
#
# Values accept:
# - `#rrggbb`                        hex
# - `red` / `bright_blue` / `reset`  terminal colour names
# - `bold` / `italic` / `underline` / `reverse` / `dim`  (bool)
#
# The palette below is a mild dark theme that matches rimeterm's
# default status bar. Comment out any block to fall back to Yazi's
# built-in default for that section.

[mgr]
cwd             = { fg = "#61afef" }
hovered         = { fg = "#282c34", bg = "#61afef" }
preview_hovered = { underline = true }
find_keyword    = { fg = "#e5c07b", italic = true }
find_position   = { fg = "#c678dd", bg = "reset", italic = true }
marker_copied   = { fg = "#98c379", bg = "#98c379" }
marker_cut      = { fg = "#e06c75", bg = "#e06c75" }
marker_marked   = { fg = "#61afef", bg = "#61afef" }
marker_selected = { fg = "#e5c07b", bg = "#e5c07b" }
tab_active      = { fg = "#282c34", bg = "#61afef" }
tab_inactive    = { fg = "#abb2bf", bg = "#3e4451" }
tab_width       = 1
border_symbol   = "│"
border_style    = { fg = "#5c6370" }

[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#3e4451", bg = "#3e4451" }
mode_normal     = { fg = "#282c34", bg = "#61afef", bold = true }
mode_select     = { fg = "#282c34", bg = "#e5c07b", bold = true }
mode_unset      = { fg = "#282c34", bg = "#e06c75", bold = true }
progress_normal = { fg = "#61afef", bg = "#3e4451" }
progress_error  = { fg = "#e06c75", bg = "#3e4451" }
permissions_t   = { fg = "#98c379" }
permissions_r   = { fg = "#e5c07b" }
permissions_w   = { fg = "#e06c75" }
permissions_x   = { fg = "#61afef" }
permissions_s   = { fg = "#5c6370" }

[input]
border   = { fg = "#61afef" }
title    = {}
value    = {}
selected = { reverse = true }

[completion]
border   = { fg = "#61afef" }
active   = { bg = "#3e4451" }
inactive = {}

[tasks]
border  = { fg = "#61afef" }
title   = {}
hovered = { underline = true }

[which]
mask            = { bg = "#282c34" }
cand            = { fg = "#61afef" }
rest            = { fg = "#5c6370" }
desc            = { fg = "#c678dd" }
separator       = "  "
separator_style = { fg = "#5c6370" }

[help]
on      = { fg = "#61afef" }
run     = { fg = "#98c379" }
desc    = { fg = "#abb2bf" }
hovered = { bg = "#3e4451", bold = true }
footer  = { fg = "#282c34", bg = "#abb2bf" }

[notify]
title_info  = { fg = "#98c379" }
title_warn  = { fg = "#e5c07b" }
title_error = { fg = "#e06c75" }

# Per-filetype colouring. Rules match top-to-bottom; first hit wins.
# `mime` globs against the MIME type; `url` globs against the file
# path/name (yazi uses the same `url` selector here as in yazi.toml
# previewers — the older docs called it `name`, but current yazi
# rejects `name` with "at least one of 'url' or 'mime' must be
# specified"). Wildcards: `*`, `?`, `[abc]`.
[filetype]
rules = [
  # Directories — orange (One Dark warm accent) so they pop against
  # regular text without clashing with the blue used for cwd / cursor.
  { url = "*/",              fg = "#d19a66", bold = true },
  # Media
  { mime = "image/*",        fg = "#c678dd" },
  { mime = "video/*",        fg = "#e5c07b" },
  { mime = "audio/*",        fg = "#e5c07b" },
  # Archives
  { mime = "application/zip",                                fg = "#e06c75" },
  { mime = "application/gzip",                               fg = "#e06c75" },
  { mime = "application/x-tar",                              fg = "#e06c75" },
  { mime = "application/x-bzip2",                            fg = "#e06c75" },
  { mime = "application/x-7z-compressed",                    fg = "#e06c75" },
  { mime = "application/x-rar",                              fg = "#e06c75" },
  # Docs
  { url = "*.md",            fg = "#61afef" },
  { url = "*.pdf",           fg = "#e06c75" },
  # Source (a taste of a bigger list — extend to your heart's content)
  { url = "*.rs",            fg = "#e06c75" },
  { url = "*.toml",          fg = "#5c6370" },
  { url = "*.lock",          fg = "#5c6370", italic = true },
  # Fallback for everything else
  { url = "*",               fg = "#abb2bf" },
]
